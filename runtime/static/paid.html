<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WebAI Bridge</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f7f8; color:#111; min-height:100dvh; }
    main { width:min(760px,100%); min-height:100dvh; margin:0 auto; background:#fff; display:flex; flex-direction:column; }
    header { padding:16px; border-bottom:1px solid #ddd; }
    h1 { font-size:20px; margin:0 0 6px; }
    p { margin:5px 0; color:#555; font-size:13px; line-height:1.45; }
    #access, #billing { padding:12px 16px; border-bottom:1px solid #eee; display:grid; gap:8px; }
    #access { padding-top:16px; padding-bottom:16px; }
    #access-state { padding:12px; border:1px solid #ddd; border-radius:12px; display:grid; gap:5px; }
    details { margin-top:4px; }
    summary { color:#666; font-size:12px; cursor:pointer; }
    #legacy-recovery { padding-top:8px; display:grid; gap:8px; }
    input { width:100%; min-height:42px; border:1px solid #bbb; border-radius:10px; padding:9px 11px; font:inherit; }
    button { border:0; border-radius:12px; padding:11px 14px; font:inherit; font-weight:700; background:#111; color:#fff; }
    button.secondary { background:#e9e9e9; color:#111; }
    #buy { width:100%; margin-top:2px; }
    #byok-connect, #byok-status { display:grid; gap:8px; }
    #byok-status { padding:10px; border:1px solid #ddd; border-radius:10px; }
    #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:88%; padding:11px 13px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.45; }
    .user { align-self:flex-end; background:#111; color:#fff; }
    .assistant { align-self:flex-start; background:#eee; }
    .system { align-self:center; color:#777; font-size:13px; padding:4px; }
    form { display:flex; gap:8px; padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); border-top:1px solid #ddd; }
    @media (pointer: coarse) { form { padding-bottom:calc(32px + env(safe-area-inset-bottom)); } }
    textarea { flex:1; resize:none; min-height:44px; max-height:140px; border:1px solid #bbb; border-radius:12px; padding:11px; font:inherit; }
    button:disabled, textarea:disabled, input:disabled { opacity:.5; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1 id="title">購入者アクセス</h1>
    <p id="welcome">購入権を確認しています。</p>
  </header>

  <section id="access">
    <div id="access-state">
      <strong id="access-title">購入権を確認しています…</strong>
      <p id="access-message">Stripe決済後は自動でAIへ接続します。</p>
    </div>
    <button id="buy" type="button">Stripeで購入する</button>
    <p>決済はこのボタンから開始してください。購入完了をこのブラウザへ安全に結び付けてから、AIアクセスを有効化します。</p>
    <details>
      <summary>旧アクセスコードを使う（復旧用）</summary>
      <div id="legacy-recovery">
        <input id="access-token" type="password" autocomplete="off" spellcheck="false" placeholder="webai_...">
        <button id="unlock" type="button">旧コードで復旧</button>
        <p>互換用の復旧経路です。通常の購入ではアクセスコードのコピーや入力は不要です。</p>
      </div>
    </details>
  </section>

  <section id="billing" hidden>
    <div id="byok-connect">
      <strong>推論用 OpenAI API Key（BYOK）</strong>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      <button id="connect-byok" type="button">APIを接続</button>
      <p>接続するとAPIキー入力欄は消えます。キー本体は接続時だけHTTPSでWebAI Bridgeへ送信し、ブラウザにはHttpOnlyの一時セッションIDだけを保持します。</p>
    </div>
    <div id="byok-status" hidden>
      <strong>✓ API接続済み</strong>
      <p id="byok-expiry"></p>
      <button id="forget-byok" class="secondary" type="button">キーを忘れる</button>
    </div>
  </section>

  <section id="messages" aria-live="polite"></section>
  <form id="form">
    <textarea id="input" rows="1" placeholder="メッセージを入力" autocomplete="off" disabled></textarea>
    <button id="send" type="submit" disabled>送信</button>
  </form>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const storageKey = `webai-entitlement:${slug}`;
  const conversationHistory = [];
  let unlocked = false;
  let byokConnected = false;

  function add(role, text) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    el.textContent = text;
    $('messages').appendChild(el);
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  function captureFragmentToken() {
    const params = new URLSearchParams(location.hash.replace(/^#/, ''));
    const token = params.get('access');
    if (token) {
      sessionStorage.setItem(storageKey, token);
      window.history.replaceState(null, '', location.pathname + location.search);
    }
  }

  function legacyToken() {
    return sessionStorage.getItem(storageKey) || '';
  }

  function entitlementHeaders() {
    const token = legacyToken();
    return token ? {'X-WebAI-Entitlement': token} : {};
  }

  function setByokState(connected, expiresIn = 0) {
    byokConnected = Boolean(connected);
    $('api-key').value = '';
    $('byok-connect').hidden = byokConnected;
    $('byok-status').hidden = !byokConnected;
    $('byok-expiry').textContent = byokConnected ? `サーバーRAM上の一時セッション。約${Math.max(1, Math.ceil(expiresIn / 60))}分以内に自動削除されます。` : '';
  }

  function lockAccess(message = '購入権を確認できません。未購入の場合は下のボタンから決済してください。決済済みの場合は購入完了ページから開き直すか、販売者へ確認してください。') {
    unlocked = false;
    setByokState(false, 0);
    $('access').hidden = false;
    $('billing').hidden = true;
    $('input').disabled = true;
    $('send').disabled = true;
    $('buy').disabled = false;
    $('title').textContent = '購入者アクセス';
    $('welcome').textContent = '購入権を確認してください。';
    $('access-title').textContent = '購入権を確認できません';
    $('access-message').textContent = message;
  }

  function unlockUI(data) {
    $('title').textContent = data.display_name;
    $('welcome').textContent = data.welcome || data.description || '';
    $('access').hidden = true;
    $('billing').hidden = false;
    $('input').disabled = false;
    $('send').disabled = false;
    unlocked = true;
  }

  async function fetchPublicConfig(headers = {}) {
    const res = await fetch(`/apps/${encodeURIComponent(slug)}/public-config`, {headers, cache:'no-store'});
    const data = await res.json().catch(() => ({}));
    return {res, data};
  }

  async function bootstrapAccess() {
    captureFragmentToken();
    let attempt = await fetchPublicConfig();
    if (!attempt.res.ok && legacyToken()) {
      attempt = await fetchPublicConfig(entitlementHeaders());
      if (!attempt.res.ok) sessionStorage.removeItem(storageKey);
    }
    if (!attempt.res.ok) {
      lockAccess();
      return;
    }
    unlockUI(attempt.data);
    await refreshByokStatus();
    $('input').focus();
  }

  async function refreshByokStatus() {
    if (!unlocked) return;
    try {
      const res = await fetch(`/api/byok/session/${encodeURIComponent(slug)}`, {headers:entitlementHeaders(), cache:'no-store'});
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { lockAccess(); return; }
      if (!res.ok) throw new Error('API接続状態を確認できませんでした');
      setByokState(Boolean(data.connected), Number(data.expires_in_seconds || 0));
    } catch (err) {
      setByokState(false, 0);
      add('system', err.message || 'API接続状態を確認できませんでした');
    }
  }

  async function connectByok() {
    let key = $('api-key').value.trim();
    if (!key) { add('system', 'OpenAI API Keyを入力してください。'); return; }
    $('connect-byok').disabled = true;
    let body = JSON.stringify({slug, api_key:key});
    $('api-key').value = '';
    key = '';
    try {
      const res = await fetch('/api/byok/session', {method:'POST', headers:{'Content-Type':'application/json', ...entitlementHeaders()}, body, cache:'no-store'});
      body = '';
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { lockAccess(); return; }
      if (!res.ok) throw new Error(data.detail || 'APIキーを一時接続できませんでした');
      setByokState(true, Number(data.expires_in_seconds || 0));
    } catch (err) {
      body = '';
      setByokState(false, 0);
      add('system', err.message || 'APIキーを一時接続できませんでした');
    } finally {
      $('connect-byok').disabled = false;
    }
  }

  async function forgetByok() {
    $('forget-byok').disabled = true;
    try {
      const res = await fetch(`/api/byok/session/${encodeURIComponent(slug)}`, {method:'DELETE', headers:entitlementHeaders(), cache:'no-store'});
      if (res.status === 401) lockAccess();
    } finally {
      setByokState(false, 0);
      $('forget-byok').disabled = false;
    }
  }

  async function legacyUnlock() {
    const token = $('access-token').value.trim();
    if (!token) { $('access-message').textContent = '旧アクセスコードを入力してください。'; return; }
    $('unlock').disabled = true;
    try {
      const attempt = await fetchPublicConfig({'X-WebAI-Entitlement': token});
      if (!attempt.res.ok) {
        sessionStorage.removeItem(storageKey);
        $('access-message').textContent = '旧アクセスコードを確認できませんでした。';
        return;
      }
      sessionStorage.setItem(storageKey, token);
      $('access-token').value = '';
      unlockUI(attempt.data);
      await refreshByokStatus();
      $('input').focus();
    } finally {
      $('unlock').disabled = false;
    }
  }

  async function submitMessage(text) {
    if (!unlocked) return;
    if (!byokConnected) { add('system', '先にAPIを接続してください。'); return; }
    const prior = conversationHistory.slice();
    add('user', text);
    $('input').value = '';
    $('input').disabled = true;
    $('send').disabled = true;
    try {
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json', ...entitlementHeaders()},
        body:JSON.stringify({slug, message:text, history:prior, payer_mode:'BYOK'})
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { lockAccess(); return; }
      if (res.status === 402 && String(data.detail || '').includes('BYOK session')) {
        setByokState(false, 0);
        add('system', 'API接続の有効期限が切れました。もう一度接続してください。');
        return;
      }
      if (!res.ok) throw new Error(data.detail || 'AIへの接続に失敗しました');
      add('assistant', data.text);
      conversationHistory.push({role:'user', content:text});
      conversationHistory.push({role:'assistant', content:data.text});
    } catch (err) {
      add('system', err.message || 'エラーが発生しました');
    } finally {
      if (unlocked) {
        $('input').disabled = false;
        $('send').disabled = false;
        $('input').focus();
      }
    }
  }

  $('buy').addEventListener('click', () => {
    $('buy').disabled = true;
    location.assign(`/api/buy/${encodeURIComponent(slug)}`);
  });
  $('unlock').addEventListener('click', legacyUnlock);
  $('connect-byok').addEventListener('click', connectByok);
  $('forget-byok').addEventListener('click', forgetByok);
  $('form').addEventListener('submit', (event) => {
    event.preventDefault();
    const text = $('input').value.trim();
    if (text) submitMessage(text);
  });
  bootstrapAccess();
})();
</script>
</body>
</html>
