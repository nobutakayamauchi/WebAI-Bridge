<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WebAI Bridge</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7f8; color: #111; min-height: 100dvh; }
    main { width: min(760px, 100%); min-height: 100dvh; margin: 0 auto; background: #fff; display: flex; flex-direction: column; }
    header { padding: 16px; border-bottom: 1px solid #ddd; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    #welcome, #billing-note, #byok-expiry { margin: 4px 0 0; font-size: 14px; color: #555; line-height: 1.45; }
    #billing { padding: 10px 16px; border-bottom: 1px solid #eee; display: grid; gap: 8px; }
    #billing label { font-size: 14px; }
    #api-key { width: 100%; min-height: 42px; border: 1px solid #bbb; border-radius: 10px; padding: 9px 11px; font: inherit; }
    #byok-connect, #byok-status { display: grid; gap: 8px; }
    #byok-status { padding: 10px; border: 1px solid #ddd; border-radius: 10px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .user { align-self: flex-end; background: #111; color: #fff; }
    .assistant { align-self: flex-start; background: #eee; color: #111; }
    .system { align-self: center; background: transparent; color: #777; font-size: 13px; padding: 4px; }
    form { display: flex; gap: 8px; padding: 12px max(12px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); border-top: 1px solid #ddd; background: #fff; }
    textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; border: 1px solid #bbb; border-radius: 12px; padding: 11px; font: inherit; }
    button { min-width: 72px; border: 0; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 700; background: #111; color: #fff; }
    button.secondary { background: #e9e9e9; color: #111; }
    button:disabled, textarea:disabled, input:disabled { opacity: .55; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header><h1 id="title">WebAI Bridge</h1><p id="welcome">読み込み中…</p></header>
  <section id="billing">
    <label>推論代の支払い元<select id="payer"></select></label>
    <div id="byok-connect" hidden>
      <label>OpenAI API Key（一時接続後、この入力欄から即時消去します）<input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..."></label>
      <button id="connect-byok" type="button">APIキーを一時接続</button>
    </div>
    <div id="byok-status" hidden>
      <strong>✓ APIキーを一時接続済み</strong>
      <span id="byok-expiry"></span>
      <button id="forget-byok" class="secondary" type="button">キーを忘れる</button>
    </div>
    <p id="billing-note"></p>
  </section>
  <section id="messages" aria-live="polite"></section>
  <form id="form"><textarea id="input" rows="1" placeholder="メッセージを入力" autocomplete="off"></textarea><button id="send" type="submit">送信</button></form>
</main>
<script>
(() => {
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const $ = (id) => document.getElementById(id);
  const title = $('title'), welcome = $('welcome'), messages = $('messages'), form = $('form'), input = $('input'), send = $('send'), payer = $('payer'), apiKey = $('api-key'), byokConnect = $('byok-connect'), byokStatus = $('byok-status'), billingNote = $('billing-note');
  const history = [];
  let byokConnected = false;

  function add(role, text) { const el = document.createElement('div'); el.className = `msg ${role}`; el.textContent = text; messages.appendChild(el); messages.scrollTop = messages.scrollHeight; }
  function setByokState(connected, expiresIn = 0) {
    byokConnected = Boolean(connected);
    apiKey.value = '';
    const byok = payer.value === 'BYOK';
    byokConnect.hidden = !byok || byokConnected;
    byokStatus.hidden = !byok || !byokConnected;
    $('byok-expiry').textContent = byokConnected ? `サーバーRAM上の一時セッション。約${Math.max(1, Math.ceil(expiresIn / 60))}分以内に自動削除されます。` : '';
  }
  function syncPayerUI() {
    const byok = payer.value === 'BYOK';
    if (!byok) {
      byokConnect.hidden = true;
      byokStatus.hidden = true;
      billingNote.textContent = 'このAIに設定された運営提供クレジットの上限内で実行します。';
      return;
    }
    setByokState(byokConnected, 0);
    billingNote.textContent = 'API利用料はあなたのAPIアカウント側に発生します。APIキー本体は接続時だけHTTPSで送信し、WebAI Bridgeサーバーの一時メモリに保持します。ブラウザにはHttpOnlyの一時セッションIDだけを保持します。';
  }
  async function refreshByokStatus() {
    if (payer.value !== 'BYOK') return;
    try {
      const res = await fetch(`/api/byok/session/${encodeURIComponent(slug)}`, {cache:'no-store'});
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'BYOK接続状態を確認できませんでした');
      setByokState(Boolean(data.connected), Number(data.expires_in_seconds || 0));
    } catch (err) {
      setByokState(false, 0);
      add('system', err.message || 'BYOK接続状態を確認できませんでした');
    }
  }
  async function connectByok() {
    let key = apiKey.value.trim();
    if (!key) { add('system', 'OpenAI API Keyを入力してください。'); return; }
    $('connect-byok').disabled = true;
    let body = JSON.stringify({slug, api_key:key});
    apiKey.value = '';
    key = '';
    try {
      const res = await fetch('/api/byok/session', {method:'POST', headers:{'Content-Type':'application/json'}, body, cache:'no-store'});
      body = '';
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'APIキーを一時接続できませんでした');
      setByokState(true, Number(data.expires_in_seconds || 0));
    } catch (err) {
      body = '';
      setByokState(false, 0);
      add('system', err.message || 'APIキーを一時接続できませんでした');
    } finally {
      $('connect-byok').disabled = false;
    }
  }
  async function forgetByok() {
    $('forget-byok').disabled = true;
    try {
      await fetch(`/api/byok/session/${encodeURIComponent(slug)}`, {method:'DELETE', cache:'no-store'});
    } finally {
      setByokState(false, 0);
      $('forget-byok').disabled = false;
    }
  }
  async function loadConfig() {
    const res = await fetch(`/apps/${encodeURIComponent(slug)}/public-config`, {cache:'no-store'});
    if (!res.ok) throw new Error('設定を読み込めませんでした');
    const cfg = await res.json();
    title.textContent = cfg.display_name;
    welcome.textContent = cfg.welcome;
    payer.replaceChildren();
    for (const mode of cfg.allowed_payer_modes) {
      const option = document.createElement('option');
      option.value = mode;
      option.textContent = mode === 'BYOK' ? '自分のAPIキー（BYOK）' : '運営提供クレジット';
      option.selected = mode === cfg.default_payer_mode;
      payer.appendChild(option);
    }
    syncPayerUI();
    if (payer.value === 'BYOK') await refreshByokStatus();
  }
  async function submitMessage(text) {
    if (payer.value === 'BYOK' && !byokConnected) { add('system', '先にAPIキーを一時接続してください。'); return; }
    const prior = history.slice();
    add('user', text);
    input.value = '';
    input.disabled = true;
    send.disabled = true;
    try {
      const res = await fetch('/api/chat', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({slug, message: text, history: prior, payer_mode: payer.value})});
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status === 401 && payer.value === 'BYOK') setByokState(false, 0);
        throw new Error(data.detail || 'AIへの接続に失敗しました');
      }
      add('assistant', data.text);
      history.push({role: 'user', content: text});
      history.push({role: 'assistant', content: data.text});
    } catch (err) {
      add('system', err.message || 'エラーが発生しました');
    } finally {
      input.disabled = false;
      send.disabled = false;
      input.focus();
    }
  }

  $('connect-byok').addEventListener('click', connectByok);
  $('forget-byok').addEventListener('click', forgetByok);
  payer.addEventListener('change', async () => { syncPayerUI(); if (payer.value === 'BYOK') await refreshByokStatus(); });
  form.addEventListener('submit', (event) => { event.preventDefault(); const text = input.value.trim(); if (text) submitMessage(text); });
  loadConfig().catch(err => add('system', err.message));
})();
</script>
</body>
</html>
